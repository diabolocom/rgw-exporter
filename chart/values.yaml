---

nameOverride: null
fullnameOverride: null

serviceMonitor:
  enabled: false
  scrapeInterval: 60s

rgwExporter:
  replicas: 1
  image:
    name: null
    tag: "latest"
    pullPolicy: IfNotPresent
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - rgw-exporter
        topologyKey: "kubernetes.io/hostname"
      preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app
              operator: In
              values:
              - rgw-exporter
          topologyKey: "topology.kubernetes.io/zone"
        weight: 10
  resources:
    requests:
      memory: "128Mi"
      cpu: "300m"
    limits:
      memory: "128Mi"
  secret:
    name: rgw-exporter
    values: null
    #  RGW_HOST: https://example.com
    #  ACCESS_KEY: user
    #  SECRET_KEY: password
  config:
    rgwHosts: []

extraObjects: []
